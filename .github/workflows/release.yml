name: Build & Release Nocturne APK

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build Signed Android APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Static Analysis
        run: flutter analyze

      - name: Run Unit Tests
        run: flutter test

      - name: Build Split APKs
        run: |
          flutter build apk --release --split-per-abi
          flutter build apk --release

      - name: Rename & Prepare Artifacts
        run: |
          mkdir -p release-artifacts
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release-artifacts/nocturne-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-release.apk release-artifacts/nocturne-universal.apk
          cd release-artifacts
          sha256sum *.apk > sha256sums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/nocturne-arm64-v8a.apk
            release-artifacts/nocturne-universal.apk
            release-artifacts/sha256sums.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
