name: Build & Release Nocturne APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Signed Android Release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Static Code Analysis
        run: flutter analyze

      - name: Run Unit Tests
        run: flutter test

      - name: Configure Production Keystore Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding production keystore from GitHub Secrets..."
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
            cat <<EOF > android/key.properties
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=app/upload-keystore.jks
          EOF
            echo "Production keystore and key.properties successfully configured."
          else
            echo "Notice: ANDROID_KEYSTORE_BASE64 secret not found. Falling back to debug signing for testing."
          fi

      - name: Build Split APKs (arm64-v8a, armeabi-v7a, x86_64)
        run: flutter build apk --release --split-per-abi

      - name: Build Universal APK
        run: flutter build apk --release

      - name: Organize Artifacts & Calculate SHA-256 Checksums (Obtainium Schema)
        run: |
          TAG="${GITHUB_REF_NAME:-v0.1.0}"
          mkdir -p release-artifacts

          # Standardisiertes Naming-Schema: Nocturne-vX.Y.Z-<abi>.apk fuer Obtainium Kompatibilitaet
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "release-artifacts/Nocturne-${TAG}-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "release-artifacts/Nocturne-${TAG}-armeabi-v7a.apk"
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk "release-artifacts/Nocturne-${TAG}-x86_64.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "release-artifacts/Nocturne-${TAG}-universal.apk"

          cd release-artifacts
          sha256sum *.apk > sha256sums.txt
          echo "Generated SHA-256 Checksums:"
          cat sha256sums.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Nocturne ${{ github.ref_name }}
          files: |
            release-artifacts/Nocturne-*-arm64-v8a.apk
            release-artifacts/Nocturne-*-armeabi-v7a.apk
            release-artifacts/Nocturne-*-x86_64.apk
            release-artifacts/Nocturne-*-universal.apk
            release-artifacts/sha256sums.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
