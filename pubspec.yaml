name: nocturne
description: "Nocturne - Bedtime Audio Engine for Audiobooks, Podcasts and Web Streams"
publish_to: "none"
version: 1.1.0+3

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  audio_service: ^0.18.19
  audio_session: ^0.2.4
  drift: ^2.35.3
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  http: ^1.2.0
  just_audio: ^0.10.6
  meta: ^1.11.0
  path: ^1.9.1
  path_provider: ^2.1.6
  sensors_plus: ^7.1.1
  sqlite3: ^3.5.2
  sqlite3_flutter_libs: ^0.6.0+eol

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  drift_dev: ^2.35.2
  build_runner: ^2.17.1

flutter:
  uses-material-design: true
